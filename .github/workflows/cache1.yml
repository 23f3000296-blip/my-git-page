name: Cache Demo

on:
  push:

jobs:
  cache-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache dependencies
        id: cache-step
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: cache-80e71fd

      - name: prime-cache-80e71fd
        run: echo "Cache hit: ${{ steps.cache-step.outputs.cache-hit }}"
